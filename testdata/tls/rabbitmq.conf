listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/weave-certs/ca.crt
ssl_options.certfile = /etc/rabbitmq/weave-certs/server.crt
ssl_options.keyfile = /etc/rabbitmq/weave-certs/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
loopback_users.guest = false
