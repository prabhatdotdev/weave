name: weave-kafka-scram-tests

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:19094:9094"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        cat > /tmp/scram-server.properties <<'EOF'
        process.roles=broker,controller
        node.id=1
        controller.quorum.voters=1@localhost:9093
        controller.listener.names=CONTROLLER
        listeners=PLAINTEXT://:9092,CONTROLLER://:9093,SASL_PLAINTEXT://:9094
        advertised.listeners=PLAINTEXT://localhost:9092,SASL_PLAINTEXT://localhost:19094
        listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
        inter.broker.listener.name=PLAINTEXT
        sasl.enabled.mechanisms=SCRAM-SHA-256,SCRAM-SHA-512
        listener.name.sasl_plaintext.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
        listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
        log.dirs=/tmp/kraft-scram-logs
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        auto.create.topics.enable=false
        EOF
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted \
          --cluster-id 5L6g3nShT-eMCtK--X86sw \
          --config /tmp/scram-server.properties \
          --add-scram 'SCRAM-SHA-256=[name=weave,password=weave-test-password]' \
          --add-scram 'SCRAM-SHA-512=[name=weave,password=weave-test-password]'
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/scram-server.properties
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
