name: Release Gate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  require-passing-ci:
    name: Require Passing CI On Tagged Commit
    runs-on: ubuntu-latest

    steps:
      - name: Verify CI conclusion for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
              event: 'push',
              head_sha: sha,
            });

            const ciRuns = runs.filter((run) => run.name === 'CI' && run.head_sha === sha);

            if (ciRuns.length === 0) {
              core.setFailed(`No CI run found for commit ${sha}. Run CI on this commit before tagging a release.`);
              return;
            }

            const successful = ciRuns.some((run) => run.conclusion === 'success');
            if (!successful) {
              const details = ciRuns.map((run) => `${run.html_url} => ${run.conclusion || run.status}`).join('\n');
              core.setFailed(`CI did not pass for commit ${sha}. Release blocked.\n${details}`);
              return;
            }

            core.info(`Found successful CI run(s) for commit ${sha}. Release gate passed.`);
