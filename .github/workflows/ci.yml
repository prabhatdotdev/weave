name: CI

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'

permissions:
  contents: read

jobs:
  validate:
    name: Test Vet Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: make test-verbose

      - name: Run Kafka integration test
        env:
          WEAVE_KAFKA_E2E: "1"
        run: |
          docker compose -f examples/amqp-kafka/compose.yaml up -d --wait kafka
          go test -race ./transport/kafka -run 'WithLiveKafka$' -count=1

      - name: Run RabbitMQ integration test
        env:
          WEAVE_AMQP_E2E: "1"
        run: |
          docker compose -f examples/amqp-kafka/compose.yaml up -d --wait rabbitmq
          go test -race ./transport/amqp -run 'WithLiveRabbitMQ$' -count=1

      - name: Enforce critical package coverage
        env:
          COVERAGE_MIN: "75.0"
        run: make test-coverage-check

      - name: Run vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Validate AMQP and Kafka example module
        working-directory: examples/amqp-kafka
        run: |
          go test ./...
          go vet ./...
          go build ./...
