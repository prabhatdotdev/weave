name: CI

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'

permissions:
  contents: read

jobs:
  vulnerabilities:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up stable Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Check library vulnerabilities
        run: |
          go mod download
          govulncheck ./...

      - name: Check example module vulnerabilities
        working-directory: examples/amqp-kafka
        run: |
          go mod download
          govulncheck ./...

  validate:
    name: Test Vet Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: make test-verbose

      - name: Cross-compile tests for 32-bit Linux
        env:
          GOOS: linux
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test -exec=true ./...

      - name: Run Kafka integration test
        env:
          WEAVE_KAFKA_E2E: "1"
        run: |
          docker compose -f examples/amqp-kafka/compose.yaml up -d --wait kafka
          go test -race ./transport/kafka -run 'WithLiveKafka$' -count=1

      - name: Run RabbitMQ integration test
        env:
          WEAVE_AMQP_E2E: "1"
        run: |
          docker compose -f examples/amqp-kafka/compose.yaml up -d --wait rabbitmq
          go test -race ./transport/amqp -run 'WithLiveRabbitMQ$' -count=1

      - name: Run sustained load and broker failure tests
        timeout-minutes: 15
        env:
          WEAVE_STRESS_DURATION: 30s
          WEAVE_STRESS_CYCLES: "3"
        run: ./scripts/test_stress.sh

      - name: Benchmark confirmed AMQP publishing
        env:
          WEAVE_AMQP_BENCH_TIME: 1s
          WEAVE_AMQP_BENCH_COUNT: "1"
        run: ./scripts/test_stress.sh bench

      - name: Run Kafka SCRAM integration tests
        env:
          WEAVE_KAFKA_SCRAM_E2E: "1"
        run: |
          docker compose -f transport/kafka/testdata/scram/compose.yaml up -d --wait
          go test -race ./transport/kafka -run 'SCRAMAuthenticationWithLiveKafka$' -count=1

      - name: Run TLS integration tests
        env:
          WEAVE_TLS_E2E: "1"
        run: |
          docker compose -f testdata/tls/compose.yaml up -d --build --wait
          go test -race ./transport/amqp ./transport/kafka -run 'TLSWithLive' -count=1

      - name: Enforce critical package coverage
        env:
          COVERAGE_MIN: "75.0"
        run: make test-coverage-check

      - name: Run vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Validate AMQP and Kafka example module
        working-directory: examples/amqp-kafka
        run: |
          go test ./...
          go vet ./...
          go build ./...
