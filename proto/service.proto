syntax = "proto3";

package mqservice;

option go_package = "github.com/prabhatdotdev/mq-service-starter/proto;proto";

// Generic request wrapper
message Request {
  string request_id = 1;
  string method = 2;
  bytes payload = 3;
  map<string, string> metadata = 4;
  int64 timestamp = 5;
}

// Generic response wrapper
message Response {
  string request_id = 1;
  bool success = 2;
  bytes payload = 3;
  string error_message = 4;
  map<string, string> metadata = 5;
  int64 timestamp = 6;
}

// Example domain messages
message UserRequest {
  string user_id = 1;
  string action = 2;
}

message UserResponse {
  string user_id = 1;
  string name = 2;
  string email = 3;
  string status = 4;
}

message OrderRequest {
  string order_id = 1;
  string user_id = 2;
  repeated string items = 3;
  double total_amount = 4;
}

message OrderResponse {
  string order_id = 1;
  string status = 2;
  string confirmation_number = 3;
  int64 created_at = 4;
}

message PaymentRequest {
  string payment_id = 1;
  string order_id = 2;
  double amount = 3;
  string payment_method = 4;
}

message PaymentResponse {
  string payment_id = 1;
  string transaction_id = 2;
  bool success = 3;
  string status = 4;
  string error_message = 5;
}
